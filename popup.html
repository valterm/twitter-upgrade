<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twitter Upgrade</title>
  <link rel="stylesheet" href="settings.css">
  <script src="defaults.js" defer></script>
  <script src="popup.js" defer></script>
</head>

<body>
  <h1>Twitter Upgrade</h1>
  <section aria-label="Features">
    <label><input type="checkbox" id="defaultPhotos" disabled>Default media to photos</label>
    <label><input type="checkbox" id="hidePremium" disabled>Hide Premium in the sidebar</label>
    <label><input type="checkbox" id="hideCreatorStudio" disabled>Hide Creator Studio in the sidebar</label>
    <label><input type="checkbox" id="hideGrok" disabled>Hide Grok in the sidebar</label>
    <label><input type="checkbox" id="hideGrokChat" disabled>Hide floating Grok chat</label>
    <label><input type="checkbox" id="hideExplainPost" disabled>Hide Explain this post</label>
    <label><input type="checkbox" id="hideProfileSummary" disabled>Hide Profile Summary</label>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
</body>

</html>
